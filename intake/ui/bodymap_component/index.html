<!doctype html>
<html><head><meta charset="utf-8">
<!-- Local Streamlit component: draws the SVG it is given and reports the tap position in SVG units.
     No network, no libraries. Python resolves the position to a region (intake/bodymap.py: hit_test). -->
<style>
  body { margin: 0; font-family: sans-serif; }
  #box { display: flex; justify-content: center; }
  svg polygon { cursor: pointer; }
  svg polygon:active { opacity: .6; }
</style></head>
<body>
<div id="box"></div>
<script>
  const send = (type, extra) => window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
  let n = 0;
  window.addEventListener("message", (ev) => {
    if (!ev.data || ev.data.type !== "streamlit:render") return;
    const box = document.getElementById("box");
    box.innerHTML = ev.data.args.svg;
    const svg = box.querySelector("svg");
    svg.addEventListener("click", (e) => {
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      n += 1;
      send("streamlit:setComponentValue", {value: {x: p.x, y: p.y, t: Date.now() + "-" + n}, dataType: "json"});
    });
    send("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight});
  });
  send("streamlit:componentReady", {apiVersion: 1});
</script>
</body></html>
