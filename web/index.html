<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B5A55" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>MediKiosk OPD</title>
    <script>
      // Theme before first paint (staff/doctor only; the kiosk is always light). No flash.
      (function () {
        try {
          var p = location.pathname;
          if (p.indexOf("/kiosk") === 0) return;
          var t = localStorage.getItem("mk.theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
